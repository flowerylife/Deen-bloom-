<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌷 DeenBloom</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#FAF6EF;font-family:Georgia,serif;}
  textarea,input,select{font-family:Georgia,serif;}
  textarea:focus,input:focus{border-color:#8BAF8A!important;outline:none;}
  select:focus{outline:none;}
  .butterfly{animation:flutter 2.5s ease-in-out infinite;transform-origin:center;}
  @keyframes flutter{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-8px) rotate(3deg);}}

  button:active{transform:scale(0.96);}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  cream:"#FAF6EF", sage:"#8BAF8A", sageDark:"#5C8A5B", sageLight:"#C8DEC7",
  blush:"#E8C4B8", blushDark:"#C8907A", gold:"#C8A96E", goldLight:"#EDD9A3",
  text:"#3A3228", textSoft:"#7A6E63", white:"#FFFFFF",
  petal1:"#F4B8C8", petal2:"#C8DEC7", petal3:"#EDD9A3", petal4:"#B8D4E8",
};

const DAILY_CARDS = [
  {type:"Hadith",icon:"📜",text:'"The best of people are those who are most beneficial to people." — Prophet Muhammad ﷺ (Al-Mu\'jam Al-Awsat)'},
  {type:"Sunnah",icon:"🌙",text:"Begin everything with Bismillah. The Prophet ﷺ said: 'Any important matter not started with the name of Allah is cut off from blessing.'"},
  {type:"Dua",icon:"🤲",text:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً — Our Lord, give us good in this world and good in the Hereafter. (Al-Baqarah 2:201)"},
  {type:"Islamic Fact",icon:"✨",text:"The word 'Sabr' (patience) appears over 90 times in the Quran — a sign of how central patience is to the believer's life."},
  {type:"Hadith",icon:"📜",text:'"Verily, with hardship comes ease." — Allah ﷻ (Ash-Sharh 94:6)'},
];
const today = new Date();
const cardOfDay = DAILY_CARDS[today.getDate() % DAILY_CARDS.length];

// ── Garden Plant SVG ──
function GardenPlant({x,y,type,bloom,size=1}){
  const s=size;
  const colors={
    rose:[C.petal1,C.blushDark,"#2D5A27"],
    tulip:[C.petal3,C.gold,"#3A6B35"],
    daisy:[C.white,C.goldLight,"#4A7A45"],
    lavender:[C.petal4,"#8A9EC8","#3A5A35"],
    lily:[C.petal2,C.sage,"#2A5025"],
  };
  const [p,a,stem]=colors[type]||colors.rose;
  const wilted=!bloom;
  return (
    <g transform={`translate(${x},${y})`} style={{opacity:wilted?0.3:1,transition:"opacity 0.8s"}}>
      <line x1="0" y1="0" x2={wilted?"-3":"0"} y2={-34*s} stroke={stem} strokeWidth={2*s}/>
      {!wilted&&<>
        <ellipse cx={-7*s} cy={-14*s} rx={5*s} ry={2.5*s} fill={stem} transform={`rotate(-40,${-7*s},${-14*s})`} opacity="0.7"/>
        <ellipse cx={7*s} cy={-20*s} rx={5*s} ry={2.5*s} fill={stem} transform={`rotate(40,${7*s},${-20*s})`} opacity="0.7"/>
      </>}
      {type==="daisy"?(
        <g transform={`translate(0,${-36*s})`}>
          {[0,45,90,135,180,225,270,315].map(ang=>(
            <ellipse key={ang} cx={Math.cos(ang*Math.PI/180)*8*s} cy={Math.sin(ang*Math.PI/180)*8*s}
              rx={4*s} ry={2.5*s} fill={p} transform={`rotate(${ang},${Math.cos(ang*Math.PI/180)*8*s},${Math.sin(ang*Math.PI/180)*8*s})`}/>
          ))}
          <circle cx="0" cy="0" r={5*s} fill={a}/>
        </g>
      ):type==="lavender"?(
        <g transform={`translate(0,${-22*s})`}>
          {[-8,-4,0,4,8].map((dx,i)=>(
            <ellipse key={i} cx={dx*s} cy={-i*4*s} rx={3.5*s} ry={2.5*s} fill={i%2===0?p:a} opacity="0.9"/>
          ))}
        </g>
      ):(
        <g transform={`translate(0,${-36*s})`}>
          {[0,72,144,216,288].map(ang=>(
            <ellipse key={ang}
              cx={Math.cos((ang-90)*Math.PI/180)*7*s} cy={Math.sin((ang-90)*Math.PI/180)*7*s}
              rx={5*s} ry={3*s} fill={p}
              transform={`rotate(${ang},${Math.cos((ang-90)*Math.PI/180)*7*s},${Math.sin((ang-90)*Math.PI/180)*7*s})`}/>
          ))}
          <circle cx="0" cy="0" r={4*s} fill={a}/>
        </g>
      )}
    </g>
  );
}

function Butterfly({x,y,active}){
  if(!active) return null;
  return(
    <g transform={`translate(${x},${y})`} className="butterfly">
      <ellipse cx="-6" cy="-4" rx="7" ry="5" fill={C.petal1} opacity="0.8"/>
      <ellipse cx="6" cy="-4" rx="7" ry="5" fill={C.petal1} opacity="0.8"/>
      <ellipse cx="-4" cy="2" rx="5" ry="3.5" fill={C.blush} opacity="0.7"/>
      <ellipse cx="4" cy="2" rx="5" ry="3.5" fill={C.blush} opacity="0.7"/>
      <line x1="0" y1="-8" x2="0" y2="6" stroke={C.text} strokeWidth="1"/>
    </g>
  );
}

function Garden({completedCount,totalCount,butterflies}){
  const ratio=totalCount>0?completedCount/totalCount:0;
  const plants=[
    {x:40,y:130,type:"rose",bloom:ratio>=0.1},
    {x:80,y:120,type:"daisy",bloom:ratio>=0.25,size:0.85},
    {x:130,y:135,type:"tulip",bloom:ratio>=0.4},
    {x:175,y:118,type:"lavender",bloom:ratio>=0.55,size:0.9},
    {x:220,y:130,type:"lily",bloom:ratio>=0.65},
    {x:260,y:122,type:"rose",bloom:ratio>=0.75,size:0.85},
    {x:300,y:130,type:"daisy",bloom:ratio>=0.85,size:1.1},
    {x:345,y:120,type:"tulip",bloom:ratio>=0.92},
    {x:55,y:145,type:"lavender",bloom:ratio>=0.3,size:0.7},
    {x:155,y:148,type:"lily",bloom:ratio>=0.5,size:0.75},
    {x:280,y:145,type:"rose",bloom:ratio>=0.8,size:0.7},
  ];
  return(
    <svg viewBox="0 0 390 160" style={{width:"100%",maxWidth:420,display:"block",margin:"0 auto"}}>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#EEF6EE"/>
          <stop offset="100%" stopColor={C.cream}/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#A8C8A7"/>
          <stop offset="100%" stopColor="#7EA87D"/>
        </linearGradient>
      </defs>
      <rect width="390" height="160" fill="url(#sky)" rx="16"/>
      <ellipse cx="195" cy="160" rx="210" ry="30" fill="url(#grass)"/>
      {plants.map((p,i)=><GardenPlant key={i} {...p}/>)}
      <Butterfly x={100} y={70} active={butterflies>=1}/>
      <Butterfly x={200} y={55} active={butterflies>=2}/>
      <Butterfly x={300} y={68} active={butterflies>=3}/>
      {ratio===1&&<text x="195" y="28" textAnchor="middle" fontSize="11" fill={C.gold} fontFamily="Georgia,serif">✦ Garden in Full Bloom ✦</text>}
    </svg>
  );
}

// ── Tasbeeh ──
const TASBEEH_LIST=[
  {ar:"سُبْحَانَ اللهِ",en:"SubhanAllah",goal:33},
  {ar:"الْحَمْدُ لِلّهِ",en:"Alhamdulillah",goal:33},
  {ar:"اللهُ أَكْبَرُ",en:"Allahu Akbar",goal:33},
  {ar:"أَسْتَغْفِرُ اللهَ",en:"Astaghfirullah",goal:100},
  {ar:"صَلِّ عَلَى النَّبِيِّ",en:"Salawat",goal:100},
];

function TasbeehTab(){
  const [counts,setCounts]=useState(TASBEEH_LIST.map(()=>0));
  const [active,setActive]=useState(0);
  const tap=()=>{
    setCounts(c=>{const n=[...c];if(n[active]<TASBEEH_LIST[active].goal)n[active]++;return n;});
  };
  const reset=()=>setCounts(c=>{const n=[...c];n[active]=0;return n;});
  const t=TASBEEH_LIST[active];
  const count=counts[active];
  const pct=Math.round((count/t.goal)*100);
  const circ=2*Math.PI*56;
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,padding:"8px 0"}}>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center"}}>
        {TASBEEH_LIST.map((tt,i)=>(
          <button key={i} onClick={()=>setActive(i)}
            style={{padding:"6px 12px",borderRadius:20,border:`1.5px solid ${active===i?C.sage:C.sageLight}`,
              background:active===i?C.sage:"transparent",color:active===i?C.white:C.sageDark,
              fontFamily:"Georgia,serif",fontSize:12,cursor:"pointer",transition:"all 0.2s"}}>
            {tt.en}
          </button>
        ))}
      </div>
      <p style={{fontFamily:"Georgia,serif",fontSize:30,color:C.sageDark,margin:0,letterSpacing:2,direction:"rtl"}}>{t.ar}</p>
      <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="130" height="130">
          <circle cx="65" cy="65" r="56" fill="none" stroke={C.sageLight} strokeWidth="7"/>
          <circle cx="65" cy="65" r="56" fill="none" stroke={C.sage} strokeWidth="7"
            strokeDasharray={`${circ*pct/100} ${circ}`}
            strokeLinecap="round" transform="rotate(-90 65 65)"
            style={{transition:"stroke-dasharray 0.3s"}}/>
        </svg>
        <div style={{position:"absolute",textAlign:"center"}}>
          <div style={{fontSize:30,fontFamily:"Georgia,serif",color:C.text,fontWeight:"bold"}}>{count}</div>
          <div style={{fontSize:11,color:C.textSoft}}>of {t.goal}</div>
        </div>
      </div>
      <button onClick={tap} disabled={count>=t.goal}
        style={{width:80,height:80,borderRadius:"50%",border:"none",
          background:count>=t.goal?C.sageLight:`linear-gradient(135deg,${C.sage},${C.sageDark})`,
          color:C.white,fontSize:22,cursor:count>=t.goal?"default":"pointer",
          boxShadow:`0 4px 16px ${C.sage}55`,transition:"all 0.15s"}}>
        {count>=t.goal?"✓":"◉"}
      </button>
      {count>=t.goal&&<p style={{color:C.gold,fontFamily:"Georgia,serif",fontSize:14,margin:0}}>🦋 MashaAllah! Goal reached!</p>}
      <button onClick={reset} style={{fontSize:11,color:C.textSoft,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Reset</button>
    </div>
  );
}

// ── Journal ──
const PROMPTS=["What am I grateful for today? 🌷","What did I improve in my deen today? 📖","What will I focus on tomorrow? 🌙"];

function JournalTab(){
  const [entries,setEntries]=useState(["","",""]);
  const [saved,setSaved]=useState(false);
  const save=()=>{setSaved(true);setTimeout(()=>setSaved(false),2000);};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <p style={{fontFamily:"Georgia,serif",color:C.textSoft,fontSize:13,margin:0,textAlign:"center"}}>
        {today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
      </p>
      {PROMPTS.map((p,i)=>(
        <div key={i}>
          <label style={{fontSize:13,color:C.sageDark,fontFamily:"Georgia,serif",display:"block",marginBottom:6}}>{p}</label>
          <textarea value={entries[i]} onChange={e=>{const n=[...entries];n[i]=e.target.value;setEntries(n);}}
            rows={3} placeholder="Write here…"
            style={{width:"100%",border:`1.5px solid ${C.sageLight}`,borderRadius:10,
              padding:"10px 12px",fontFamily:"Georgia,serif",fontSize:13,color:C.text,
              background:C.white,resize:"vertical",lineHeight:1.6}}/>
        </div>
      ))}
      <button onClick={save}
        style={{alignSelf:"center",padding:"10px 28px",background:`linear-gradient(135deg,${C.sage},${C.sageDark})`,
          color:C.white,border:"none",borderRadius:20,fontFamily:"Georgia,serif",fontSize:14,
          cursor:"pointer",boxShadow:`0 3px 10px ${C.sage}44`}}>
        {saved?"✓ Saved":"Save Reflection"}
      </button>
    </div>
  );
}

// ── Duas ──
const INIT_DUAS=[
  {text:"Grant my family ease and happiness",category:"Family",status:"Making Dua"},
  {text:"Guide me in my Quran memorisation",category:"Hifz",status:"Making Dua"},
  {text:"Grant me good health and afiyah",category:"Health",status:"Answered 🤲"},
];
const STATUSES=["Making Dua","Answered 🤲","Ongoing"];

function DuaTab(){
  const [duas,setDuas]=useState(INIT_DUAS);
  const [newText,setNewText]=useState("");
  const [newCat,setNewCat]=useState("Family");
  const add=()=>{if(!newText.trim())return;setDuas(d=>[...d,{text:newText.trim(),category:newCat,status:"Making Dua"}]);setNewText("");};
  const cycleStatus=(i)=>setDuas(d=>{const n=[...d];const cur=STATUSES.indexOf(n[i].status);n[i]={...n[i],status:STATUSES[(cur+1)%STATUSES.length]};return n;});
  const remove=(i)=>setDuas(d=>d.filter((_,j)=>j!==i));
  const sc=s=>s==="Answered 🤲"?C.sage:s==="Ongoing"?C.gold:C.blushDark;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {duas.map((d,i)=>(
        <div key={i} style={{background:C.white,borderRadius:12,padding:"12px 14px",
          boxShadow:"0 1px 8px rgba(0,0,0,0.07)",display:"flex",alignItems:"flex-start",gap:10}}>
          <div style={{flex:1}}>
            <p style={{margin:0,fontSize:13,color:C.text,fontFamily:"Georgia,serif",lineHeight:1.5}}>{d.text}</p>
            <span style={{fontSize:11,color:C.textSoft}}>{d.category}</span>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
            <button onClick={()=>cycleStatus(i)}
              style={{fontSize:10,padding:"3px 8px",borderRadius:10,border:`1px solid ${sc(d.status)}`,
                color:sc(d.status),background:"transparent",cursor:"pointer",whiteSpace:"nowrap"}}>
              {d.status}
            </button>
            <button onClick={()=>remove(i)} style={{fontSize:10,color:C.textSoft,background:"none",border:"none",cursor:"pointer"}}>✕</button>
          </div>
        </div>
      ))}
      <div style={{background:C.white,borderRadius:12,padding:"12px 14px",boxShadow:"0 1px 8px rgba(0,0,0,0.07)"}}>
        <p style={{margin:"0 0 8px",fontSize:12,color:C.sageDark,fontFamily:"Georgia,serif"}}>+ Add a Dua</p>
        <input value={newText} onChange={e=>setNewText(e.target.value)} placeholder="Write your dua…"
          style={{width:"100%",border:`1.5px solid ${C.sageLight}`,borderRadius:8,
            padding:"8px 10px",fontFamily:"Georgia,serif",fontSize:13,marginBottom:8}}/>
        <div style={{display:"flex",gap:8}}>
          <select value={newCat} onChange={e=>setNewCat(e.target.value)}
            style={{flex:1,border:`1.5px solid ${C.sageLight}`,borderRadius:8,padding:"6px 8px",
              fontFamily:"Georgia,serif",fontSize:12}}>
            {["Family","Health","Hifz","Studies","Rizq","General"].map(c=><option key={c}>{c}</option>)}
          </select>
          <button onClick={add}
            style={{padding:"6px 16px",background:C.sage,color:C.white,border:"none",
              borderRadius:8,fontFamily:"Georgia,serif",fontSize:12,cursor:"pointer"}}>
            Add
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Challenges ──
const CHALLENGES_DATA=[
  {name:"7-Day Salah Challenge",days:7,icon:"🕌",reward:"Rose 🌹"},
  {name:"30-Day Quran Challenge",days:30,icon:"📖",reward:"Lily 🌸"},
  {name:"7 Days Without Gossip",days:7,icon:"🤐",reward:"Daisy 🌼"},
  {name:"Morning Adhkar Challenge",days:14,icon:"🌅",reward:"Tulip 🌷"},
  {name:"Tahajjud Challenge",days:21,icon:"🌙",reward:"Lavender 💜"},
];

function ChallengesTab(){
  const [progress,setProgress]=useState(CHALLENGES_DATA.map(()=>0));
  const checkin=(i)=>setProgress(p=>{const n=[...p];if(n[i]<CHALLENGES_DATA[i].days)n[i]++;return n;});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {CHALLENGES_DATA.map((ch,i)=>{
        const pct=Math.round((progress[i]/ch.days)*100);
        const done=progress[i]===ch.days;
        return(
          <div key={i} style={{background:C.white,borderRadius:14,padding:"14px 16px",
            boxShadow:"0 2px 10px rgba(0,0,0,0.07)",border:done?`1.5px solid ${C.gold}`:"none"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:20}}>{ch.icon}</span>
                <div>
                  <p style={{margin:0,fontSize:13,fontFamily:"Georgia,serif",color:C.text}}>{ch.name}</p>
                  <p style={{margin:0,fontSize:11,color:C.textSoft}}>{progress[i]}/{ch.days} days · Unlocks {ch.reward}</p>
                </div>
              </div>
              {done?<span style={{fontSize:18}}>🌸</span>:
                <button onClick={()=>checkin(i)}
                  style={{padding:"5px 12px",background:`linear-gradient(135deg,${C.sage},${C.sageDark})`,
                    color:C.white,border:"none",borderRadius:10,fontSize:11,fontFamily:"Georgia,serif",cursor:"pointer"}}>
                  +Day
                </button>}
            </div>
            <div style={{height:6,background:C.sageLight,borderRadius:3,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${C.sage},${C.sageDark})`,
                borderRadius:3,transition:"width 0.4s"}}/>
            </div>
            {done&&<p style={{margin:"6px 0 0",fontSize:11,color:C.gold,fontFamily:"Georgia,serif"}}>
              ✦ Challenge complete! Rare flower unlocked in your garden.
            </p>}
          </div>
        );
      })}
    </div>
  );
}

// ── MAIN APP ──
const PRAYERS=["Fajr","Dhuhr","Asr","Maghrib","Isha","Tahajjud"];
const ADHKAR=["Morning Adhkar","Evening Adhkar","Daily Dhikr","Islamic Learning"];
const TABS=[
  {id:"home",label:"Home",icon:"🌷"},
  {id:"salah",label:"Salah",icon:"🕌"},
  {id:"quran",label:"Quran",icon:"📖"},
  {id:"tasbeeh",label:"Tasbeeh",icon:"📿"},
  {id:"challenges",label:"Challenges",icon:"🌟"},
  {id:"journal",label:"Journal",icon:"📝"},
  {id:"duas",label:"Duas",icon:"🤲"},
];

function DeenBloom(){
  const [tab,setTab]=useState("home");
  const [prayers,setPrayers]=useState(PRAYERS.map(()=>false));
  const [adhkar,setAdhkar]=useState(ADHKAR.map(()=>false));
  const [quranPages,setQuranPages]=useState(0);
  const quranGoal=5;
  const [surahs,setSurahs]=useState(0);

  const totalHabits=PRAYERS.length+ADHKAR.length+1;
  const completedHabits=prayers.filter(Boolean).length+adhkar.filter(Boolean).length+(quranPages>=quranGoal?1:0);
  const butterflies=[33,66,100].filter(t=>Math.round(completedHabits/totalHabits*100)>=t).length;
  const pct=Math.round(completedHabits/totalHabits*100);

  const togglePrayer=(i)=>setPrayers(p=>{const n=[...p];n[i]=!n[i];return n;});
  const toggleAdhkar=(i)=>setAdhkar(a=>{const n=[...a];n[i]=!n[i];return n;});

  const card={background:C.white,borderRadius:18,padding:"18px 18px",margin:"0 16px 14px",boxShadow:"0 2px 16px rgba(0,0,0,0.06)"};
  const secTitle={fontSize:13,color:C.sageDark,letterSpacing:1,margin:"0 0 12px",textTransform:"uppercase",fontFamily:"Georgia,serif"};
  const row={display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.cream}`};
  const chk=(checked)=>({width:22,height:22,borderRadius:6,border:`2px solid ${checked?C.sage:C.sageLight}`,
    background:checked?C.sage:"transparent",display:"flex",alignItems:"center",justifyContent:"center",
    cursor:"pointer",flexShrink:0,transition:"all 0.2s"});

  return(
    <div style={{minHeight:"100vh",background:C.cream,fontFamily:"Georgia,serif",maxWidth:430,margin:"0 auto",paddingBottom:72}}>
      {/* Header */}
      <div style={{padding:"20px 20px 0",textAlign:"center"}}>
        <h1 style={{fontSize:24,color:C.sageDark,margin:0,letterSpacing:1}}>🌷 DeenBloom</h1>
        <p style={{fontSize:12,color:C.textSoft,margin:"4px 0 0",letterSpacing:2}}>GROW YOUR DEEN, ONE DAY AT A TIME</p>
      </div>

      {/* HOME */}
      {tab==="home"&&<>
        <div style={{...card,padding:"16px 12px"}}>
          <p style={{...secTitle,textAlign:"center"}}>Your Garden Today</p>
          <Garden completedCount={completedHabits} totalCount={totalHabits} butterflies={butterflies}/>
          <div style={{display:"flex",justifyContent:"center",gap:6,marginTop:10}}>
            <div style={{background:C.sageLight,borderRadius:10,padding:"4px 14px",fontSize:12,color:C.sageDark}}>
              {completedHabits}/{totalHabits} habits · {pct}%
            </div>
            {butterflies>0&&<div style={{background:C.petal1+"55",borderRadius:10,padding:"4px 10px",fontSize:12,color:C.blushDark}}>🦋 ×{butterflies}</div>}
          </div>
        </div>

        <div style={{...card,background:`linear-gradient(135deg,${C.sageLight}33,${C.petal3}33)`,border:`1px solid ${C.goldLight}`}}>
          <p style={secTitle}>{cardOfDay.icon} {cardOfDay.type} of the Day</p>
          <p style={{fontSize:13,color:C.text,lineHeight:1.7,margin:0}}>{cardOfDay.text}</p>
        </div>

        <div style={card}>
          <p style={secTitle}>🕌 Salah</p>
          {PRAYERS.slice(0,5).map((pr,i)=>(
            <div key={i} style={row}>
              <div style={chk(prayers[i])} onClick={()=>togglePrayer(i)}>
                {prayers[i]&&<span style={{fontSize:13,color:C.white}}>✓</span>}
              </div>
              <span style={{fontSize:14,color:prayers[i]?C.text:C.textSoft}}>{pr}</span>
              {prayers[i]&&<span style={{marginLeft:"auto",fontSize:11,color:C.gold}}>✦ Alhamdulillah</span>}
            </div>
          ))}
        </div>

        <div style={card}>
          <p style={secTitle}>🌿 Daily Habits</p>
          {ADHKAR.map((a,i)=>(
            <div key={i} style={row}>
              <div style={chk(adhkar[i])} onClick={()=>toggleAdhkar(i)}>
                {adhkar[i]&&<span style={{fontSize:13,color:C.white}}>✓</span>}
              </div>
              <span style={{fontSize:14,color:adhkar[i]?C.text:C.textSoft}}>{a}</span>
            </div>
          ))}
        </div>

        <div style={{...card,marginBottom:0}}>
          <p style={secTitle}>📖 Quran Today</p>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <button onClick={()=>setQuranPages(p=>Math.max(0,p-1))}
              style={{width:32,height:32,borderRadius:8,border:`1.5px solid ${C.sageLight}`,
                background:"none",fontSize:16,cursor:"pointer",color:C.sage}}>−</button>
            <div style={{flex:1,textAlign:"center"}}>
              <span style={{fontSize:22,color:C.sageDark}}>{quranPages}</span>
              <span style={{fontSize:12,color:C.textSoft}}> / {quranGoal} pages</span>
            </div>
            <button onClick={()=>setQuranPages(p=>p+1)}
              style={{width:32,height:32,borderRadius:8,border:`1.5px solid ${C.sageLight}`,
                background:"none",fontSize:16,cursor:"pointer",color:C.sage}}>+</button>
          </div>
          <div style={{height:6,background:C.sageLight,borderRadius:3,overflow:"hidden",marginTop:12}}>
            <div style={{height:"100%",width:`${Math.min(quranPages/quranGoal*100,100)}%`,
              background:`linear-gradient(90deg,${C.sage},${C.sageDark})`,borderRadius:3,transition:"width 0.3s"}}/>
          </div>
          {quranPages>=quranGoal&&<p style={{margin:"8px 0 0",fontSize:12,color:C.gold}}>✦ Daily Quran goal reached! BārakAllāhu fīk.</p>}
        </div>
      </>}

      {/* SALAH */}
      {tab==="salah"&&<>
        <div style={card}>
          <p style={secTitle}>🕌 Daily Salah Tracker</p>
          {PRAYERS.map((pr,i)=>(
            <div key={i} style={row}>
              <div style={chk(prayers[i])} onClick={()=>togglePrayer(i)}>
                {prayers[i]&&<span style={{fontSize:13,color:C.white}}>✓</span>}
              </div>
              <span style={{fontSize:14,color:prayers[i]?C.text:C.textSoft}}>{pr}</span>
              {i===5&&<span style={{marginLeft:"auto",fontSize:10,color:C.gold,background:C.gold+"22",borderRadius:8,padding:"2px 7px"}}>Sunnah</span>}
            </div>
          ))}
          <div style={{marginTop:12,padding:"10px 14px",background:C.sageLight+"44",borderRadius:10}}>
            <p style={{margin:0,fontSize:12,color:C.sageDark}}>
              {prayers.filter(Boolean).length} of 5 fard prayers ✓
              {prayers.slice(0,5).every(Boolean)&&" 🌸 All fard prayers complete!"}
            </p>
          </div>
        </div>
        <div style={card}>
          <p style={secTitle}>🔄 Qaza Tracker</p>
          {["Fajr","Dhuhr","Asr","Maghrib","Isha"].map((pr,i)=>(
            <div key={i} style={{...row,justifyContent:"space-between"}}>
              <span style={{fontSize:13,color:C.text}}>{pr} Qaza</span>
              <span style={{fontSize:11,color:C.sage}}>Tracked ✓</span>
            </div>
          ))}
          <p style={{fontSize:11,color:C.textSoft,margin:"12px 0 0",lineHeight:1.6}}>
            Qaza tracking is personal. Consult a scholar for your individual situation. May Allah make it easy for you. 🤲
          </p>
        </div>
      </>}

      {/* QURAN */}
      {tab==="quran"&&<>
        <div style={card}>
          <p style={secTitle}>📖 Quran Tracker</p>
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            <div>
              <label style={{fontSize:12,color:C.textSoft,display:"block",marginBottom:6}}>Pages read today</label>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <button onClick={()=>setQuranPages(p=>Math.max(0,p-1))}
                  style={{width:36,height:36,borderRadius:8,border:`1.5px solid ${C.sageLight}`,
                    background:"none",fontSize:18,cursor:"pointer",color:C.sage}}>−</button>
                <span style={{fontSize:24,color:C.sageDark,minWidth:40,textAlign:"center"}}>{quranPages}</span>
                <button onClick={()=>setQuranPages(p=>p+1)}
                  style={{width:36,height:36,borderRadius:8,border:`1.5px solid ${C.sageLight}`,
                    background:"none",fontSize:18,cursor:"pointer",color:C.sage}}>+</button>
                <span style={{fontSize:12,color:C.textSoft}}>/ {quranGoal} page goal</span>
              </div>
            </div>
            <div>
              <label style={{fontSize:12,color:C.textSoft,display:"block",marginBottom:6}}>Surahs memorised</label>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <button onClick={()=>setSurahs(s=>Math.max(0,s-1))}
                  style={{width:36,height:36,borderRadius:8,border:`1.5px solid ${C.sageLight}`,
                    background:"none",fontSize:18,cursor:"pointer",color:C.sage}}>−</button>
                <span style={{fontSize:24,color:C.sageDark,minWidth:40,textAlign:"center"}}>{surahs}</span>
                <button onClick={()=>setSurahs(s=>s+1)}
                  style={{width:36,height:36,borderRadius:8,border:`1.5px solid ${C.sageLight}`,
                    background:"none",fontSize:18,cursor:"pointer",color:C.sage}}>+</button>
                <span style={{fontSize:12,color:C.textSoft}}>surahs</span>
              </div>
            </div>
          </div>
          <div style={{marginTop:16,padding:"12px 14px",background:`linear-gradient(135deg,${C.sageLight}33,${C.petal3}22)`,borderRadius:12}}>
            <p style={{margin:0,fontSize:12,color:C.sageDark,lineHeight:1.6}}>
              "The best of you are those who learn the Quran and teach it." — Prophet Muhammad ﷺ
            </p>
          </div>
        </div>
        <div style={card}>
          <p style={secTitle}>🌱 Weekly Quran Streak</p>
          <div style={{display:"flex",gap:6,justifyContent:"center"}}>
            {["S","M","T","W","T","F","S"].map((d,i)=>{
              const filled=i<today.getDay();
              return(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                  <div style={{width:32,height:32,borderRadius:8,
                    background:filled?`linear-gradient(135deg,${C.sage},${C.sageDark})`:C.sageLight,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:13,color:filled?C.white:C.textSoft}}>
                    {filled?"✓":"·"}
                  </div>
                  <span style={{fontSize:9,color:C.textSoft}}>{d}</span>
                </div>
              );
            })}
          </div>
        </div>
      </>}

      {tab==="tasbeeh"&&<div style={card}><TasbeehTab/></div>}
      {tab==="challenges"&&<div style={{padding:"0 16px"}}><ChallengesTab/></div>}
      {tab==="journal"&&<div style={card}><JournalTab/></div>}
      {tab==="duas"&&<div style={{padding:"0 16px"}}><DuaTab/></div>}

      {/* Nav */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",
        maxWidth:430,background:C.white,borderTop:`1px solid ${C.sageLight}`,
        display:"flex",justifyContent:"space-around",padding:"8px 0 10px",
        boxShadow:"0 -2px 12px rgba(0,0,0,0.07)"}}>
        {TABS.map(t=>(
          <div key={t.id} onClick={()=>setTab(t.id)}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",
              opacity:tab===t.id?1:0.45,transition:"opacity 0.2s"}}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span style={{fontSize:9,color:tab===t.id?C.sageDark:C.textSoft,letterSpacing:0.5}}>{t.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DeenBloom/>);
</script>
</body>
</html>
